name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit ruff black yamllint check-jsonschema

      - name: Run pre-commit
        run: pre-commit run --all-files

  compose-smoke:
    name: Docker Compose Smoke (optional)
    runs-on: ubuntu-latest
    # Not: Fork PR'larında runner'da Docker izinleri kısıtlı olabilir; push için koşturuyoruz.
    if: ${{ github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show docker compose version
        run: docker compose version

      - name: Launch core services (short)
        working-directory: ./.devcontainer
        run: |
          docker compose up -d mariadb redis-cache redis-queue
          # kısa bekleme
          sleep 10
          docker compose ps

      - name: Health check (MariaDB ping)
        working-directory: ./.devcontainer
        run: |
          # compose içindeki mariadb konteynerine direkt ping at
          docker compose exec -T mariadb sh -lc 'mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -p123 --silent'

      - name: Shutdown
        if: always()
        working-directory: ./.devcontainer
        run: docker compose down -v